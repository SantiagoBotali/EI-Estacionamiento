<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiosco de Ingreso — Estacionamiento SDG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #111827;
      color: #f9fafb;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* ── Screens ───────────────────────────────────────────────────────────── */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }
    .screen.active { display: flex; }

    /* ── Idle ──────────────────────────────────────────────────────────────── */
    #idle .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #f9fafb;
    }
    #idle .logo span { color: #22c55e; }
    #idle .subtitle {
      font-size: 1.25rem;
      color: #9ca3af;
      margin-top: -1rem;
    }

    #btn-entry {
      margin-top: 1.5rem;
      background: #16a34a;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 9999px;
      padding: 1.5rem 4rem;
      cursor: pointer;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
      animation: pulse-ring 2s ease-out infinite;
      transition: background 0.15s;
    }
    #btn-entry:hover { background: #15803d; }
    #btn-entry:active { transform: scale(0.97); }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
      70%  { box-shadow: 0 0 0 28px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* ── Loading ───────────────────────────────────────────────────────────── */
    #loading .spinner {
      width: 80px;
      height: 80px;
      border: 8px solid #374151;
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading .loading-text {
      font-size: 1.6rem;
      color: #d1fae5;
      font-weight: 600;
    }

    /* ── Ticket ────────────────────────────────────────────────────────────── */
    #ticket .ticket-card {
      background: #1f2937;
      border: 2px solid #22c55e;
      border-radius: 1.5rem;
      padding: 2.5rem 3rem;
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.15);
    }

    #ticket .welcome {
      font-size: 1.5rem;
      font-weight: 700;
      color: #22c55e;
    }

    #ticket .ticket-label {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
    }

    #ticket .ticket-code {
      font-family: 'Courier New', Courier, monospace;
      font-size: 2.2rem;
      font-weight: 700;
      color: #f9fafb;
      background: #111827;
      border-radius: 0.75rem;
      padding: 0.6rem 1.5rem;
      letter-spacing: 0.08em;
    }

    #ticket .entry-time {
      font-size: 1.1rem;
      color: #d1d5db;
    }

    #ticket .barcode-wrap {
      background: #fff;
      border-radius: 0.5rem;
      padding: 0.75rem 1.25rem;
      max-width: 340px;
      width: 100%;
    }
    #ticket .barcode-wrap svg {
      width: 100%;
      height: auto;
      display: block;
    }

    #ticket .save-msg {
      font-size: 1rem;
      color: #9ca3af;
      font-style: italic;
    }

    /* Progress bar */
    #ticket .progress-track {
      width: 100%;
      height: 8px;
      background: #374151;
      border-radius: 9999px;
      overflow: hidden;
    }
    #ticket .progress-bar {
      height: 100%;
      background: #22c55e;
      border-radius: 9999px;
      width: 100%;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <!-- ── IDLE ──────────────────────────────────────────────────────────────── -->
  <section id="idle" class="screen active">
    <div class="logo">Estacionamiento <span>SDG</span></div>
    <p class="subtitle">Sistema de gestión de estacionamiento</p>
    <button id="btn-entry" onclick="crearIngreso()">TOQUE PARA INGRESAR</button>
  </section>

  <!-- ── LOADING ───────────────────────────────────────────────────────────── -->
  <section id="loading" class="screen">
    <div class="spinner"></div>
    <p class="loading-text">Generando ticket…</p>
  </section>

  <!-- ── TICKET ────────────────────────────────────────────────────────────── -->
  <section id="ticket" class="screen">
    <div class="ticket-card">
      <p class="welcome">¡Bienvenido!</p>
      <p class="ticket-label">Código de ticket</p>
      <div class="ticket-code" id="tc-code">—</div>
      <p class="entry-time" id="tc-time">—</p>
      <div class="barcode-wrap" id="tc-barcode"></div>
      <p class="save-msg">Guarde su ticket para salir.</p>
      <div class="progress-track">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
  </section>

  <script>
    // ── State machine ────────────────────────────────────────────────────────
    const screens = ['idle', 'loading', 'ticket'];
    let resetTimer = null;
    let progressInterval = null;

    function setState(state) {
      screens.forEach(s => {
        document.getElementById(s).classList.toggle('active', s === state);
      });
    }

    // ── Entry flow ───────────────────────────────────────────────────────────
    async function crearIngreso() {
      setState('loading');

      try {
        const res = await fetch('/api/public/entry', { method: 'POST' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        showTicket(data);
        setState('ticket');
        startCountdown(5000);
      } catch (err) {
        console.error('Error al crear ingreso:', err);
        setState('idle');
      }
    }

    // ── Populate ticket ──────────────────────────────────────────────────────
    function showTicket(data) {
      document.getElementById('tc-code').textContent = data.ticket_code;

      const dt = new Date(data.entry_at);
      document.getElementById('tc-time').textContent =
        'Ingreso: ' + dt.toLocaleString('es-AR', {
          dateStyle: 'short',
          timeStyle: 'medium',
        });

      document.getElementById('tc-barcode').innerHTML = data.barcode_svg;
    }

    // ── 5-second countdown then reset ───────────────────────────────────────
    function startCountdown(ms) {
      const bar = document.getElementById('progress-bar');
      bar.style.width = '100%';

      const start = performance.now();

      clearInterval(progressInterval);
      clearTimeout(resetTimer);

      progressInterval = setInterval(() => {
        const elapsed = performance.now() - start;
        const pct = Math.max(0, 100 - (elapsed / ms) * 100);
        bar.style.width = pct + '%';
        if (pct <= 0) clearInterval(progressInterval);
      }, 50);

      resetTimer = setTimeout(() => {
        clearInterval(progressInterval);
        setState('idle');
        document.getElementById('tc-barcode').innerHTML = '';
      }, ms);
    }
  </script>
</body>
</html>
