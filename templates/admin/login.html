<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Iniciar Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
  <div class="bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🔐</div>
      <h1 class="text-2xl font-bold text-white">Panel de Administración</h1>
      <p class="text-gray-400 text-sm mt-1">Sistema de Estacionamiento</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-300 mb-1">Usuario</label>
        <input type="text" id="username" autocomplete="username"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-purple-500"
          placeholder="admin" required />
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password"
          class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-purple-500"
          placeholder="••••••••" required />
      </div>
      <div id="error-msg" class="hidden text-red-400 text-sm text-center py-2 bg-red-900/30 rounded-lg"></div>
      <button type="submit"
        class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg transition-colors">
        Ingresar como Admin
      </button>
    </form>

    <div class="mt-4 text-center">
      <a href="/employee/login" class="text-xs text-gray-500 hover:text-gray-300">Volver al login de empleado</a>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('access_token');
    const role  = localStorage.getItem('role');
    if (token && role === 'ADMIN') window.location.href = '/admin/dashboard';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      errEl.classList.add('hidden');

      const body = new URLSearchParams({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      });

      try {
        const res = await fetch('/auth/token', { method: 'POST', body });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.detail || 'Error de autenticación';
          errEl.classList.remove('hidden');
          return;
        }
        if (data.role !== 'ADMIN') {
          errEl.textContent = 'Se requiere rol de administrador';
          errEl.classList.remove('hidden');
          return;
        }
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('username', data.username);
        window.location.href = '/admin/dashboard';
      } catch {
        errEl.textContent = 'No se pudo conectar al servidor';
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
